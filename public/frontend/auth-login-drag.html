<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMS Adaptive - Authentification</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --primary: #d4af37;
            --primary-dark: #b8941f;
            --dark-bg: #0f1419;
            --card-bg: #1a1f2e;
            --text-light: #e4e6eb;
            --text-muted: #9ca3af;
            --accent: #6366f1;
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0e18 0%, #1a1f2e 100%);
            color: var(--text-light);
            overflow: hidden;
            height: 100vh;
        }
        .auth-container {
            display: flex;
            height: 100vh;
            gap: 0;
        }
        .lamp-section {
            flex: 0 0 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #1a1f2e 0%, #0f1419 100%);
            user-select: none;
        }
        .lamp-background {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }
        .lamp-background.off {
            background: radial-gradient(circle at 30% 60%, rgba(212, 175, 55, 0.05) 0%, transparent 50%);
            transition: background 0.5s ease;
        }
        .lamp-background.on {
            background: radial-gradient(circle at 30% 60%, rgba(212, 175, 55, 0.4) 0%, transparent 50%);
            animation: lampRadiate 2s ease-in-out infinite;
        }
        @keyframes lampRadiate {
            0%, 100% {
                background: radial-gradient(circle at 30% 60%, rgba(212, 175, 55, 0.4) 0%, transparent 50%);
            }
            50% {
                background: radial-gradient(circle at 30% 60%, rgba(212, 175, 55, 0.6) 0%, transparent 50%);
            }
        }
        .lamp-container {
            position: relative;
            width: 200px;
            height: 300px;
            perspective: 1000px;
            z-index: 10;
            cursor: grab;
        }
        .lamp-container.active {
            cursor: grabbing;
        }
        .lamp-svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.5));
            animation: lampFloat 4s ease-in-out infinite;
        }
        @keyframes lampFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }
        .lamp-light {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            width: 180px;
            height: 180px;
            border-radius: 50%;
            filter: blur(50px);
            opacity: 0;
            transition: opacity 0.8s ease;
            pointer-events: none;
        }
        .lamp-light.off {
            opacity: 0;
            transform: translateX(-50%) scale(0.5);
            background: radial-gradient(circle, rgba(212, 175, 55, 0) 0%, transparent 100%);
        }
        .lamp-light.on {
            opacity: 1;
            transform: translateX(-50%) scale(1);
            background: radial-gradient(circle, rgba(255, 223, 107, 0.9) 0%, rgba(212, 175, 55, 0.4) 70%, transparent 100%);
            animation: lampPulse 2s ease-in-out infinite;
        }
        @keyframes lampPulse {
            0%, 100% {
                opacity: 1;
                transform: translateX(-50%) scale(1);
            }
            50% {
                opacity: 0.8;
                transform: translateX(-50%) scale(1.2);
            }
        }
        .lamp-bulb {
            transition: fill 0.8s ease;
        }
        .lamp-bulb.off {
            fill: #4a4a4a;
        }
        .lamp-bulb.on {
            fill: #ffd700;
            filter: drop-shadow(0 0 30px rgba(255, 215, 0, 1));
        }
        .lamp-text {
            position: absolute;
            bottom: -40px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--primary);
            text-align: center;
            animation: fadeInUp 1s ease-out 0.5s backwards;
        }
        .lamp-hint {
            position: absolute;
            bottom: -70px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.85rem;
            color: var(--text-muted);
            text-align: center;
            max-width: 200px;
            opacity: 1;
            transition: opacity 0.5s ease;
        }
        .lamp-hint.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .form-section {
            flex: 0 0 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            background: var(--dark-bg);
            overflow: hidden;
        }
        .form-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.3), transparent);
        }
        .form-container {
            width: 100%;
            max-width: 420px;
            opacity: 0;
            transform: translateX(30px);
            pointer-events: none;
            transition: all 0.6s ease 0.3s;
        }
        .form-container.visible {
            opacity: 1;
            transform: translateX(0);
            pointer-events: auto;
            animation: slideInRight 0.8s ease-out;
        }
        .tab-container {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            padding-bottom: 1rem;
        }
        .tab-btn {
            flex: 1;
            padding: 0.75rem;
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .tab-btn.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }
        .tab-btn:hover:not(.active) {
            color: var(--text-light);
        }
        .tab-content {
            display: none;
            animation: fadeInScale 0.4s ease-out;
        }
        .tab-content.active {
            display: block;
        }
        .form-heading {
            margin-bottom: 1.5rem;
        }
        .form-heading h2 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .form-heading p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            font-weight: 600;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 0.85rem 1rem;
            background: rgba(212, 175, 55, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 0.5rem;
            color: var(--text-light);
            font-size: 0.95rem;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            background: rgba(212, 175, 55, 0.1);
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }
        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--primary);
        }
        .checkbox-group label {
            margin: 0;
            flex: 1;
            font-size: 0.9rem;
            cursor: pointer;
            color: var(--text-light);
        }
        .btn {
            width: 100%;
            padding: 0.9rem;
            border: none;
            border-radius: 0.5rem;
            font-size: 0.95rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: var(--dark-bg);
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(212, 175, 55, 0.4);
        }
        .btn-primary:active {
            transform: translateY(0);
        }
        .btn-secondary {
            background: rgba(212, 175, 55, 0.1);
            color: var(--primary);
            border: 1px solid var(--primary);
        }
        .btn-secondary:hover {
            background: rgba(212, 175, 55, 0.15);
        }
        .btn.loading {
            pointer-events: none;
            opacity: 0.8;
        }
        .btn.loading::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            top: 50%;
            right: 1rem;
            transform: translateY(-50%);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid currentColor;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: translateY(-50%) rotate(360deg); }
        }
        .message {
            padding: 0.9rem 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
            display: none;
            animation: slideDown 0.3s ease-out;
        }
        .message.show {
            display: block;
        }
        .message.success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
        }
        .message.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--error);
            color: var(--error);
        }
        .message.warning {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid var(--warning);
            color: var(--warning);
        }
        .link {
            color: var(--primary);
            text-decoration: none;
            cursor: pointer;
            border-bottom: 1px solid transparent;
        }
        .link:hover {
            color: var(--primary-dark);
            border-bottom-color: var(--primary);
        }
        .form-footer {
            margin-top: 1.5rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @media (max-width: 1024px) {
            .auth-container { flex-direction: column; }
            .lamp-section { flex: 0 0 40%; padding: 2rem; }
            .form-section { flex: 0 0 60%; padding: 1.5rem; }
            .form-container { max-width: 100%; }
            .form-heading h2 { font-size: 1.5rem; }
            .lamp-container { width: 150px; height: 220px; }
        }
        @media (max-width: 640px) {
            .auth-container { flex-direction: column; }
            .lamp-section { flex: 0 0 35%; min-height: 250px; }
            .form-section { flex: 1; }
            .lamp-container { width: 120px; height: 180px; }
            .tab-container { flex-direction: column; }
            .form-group input, .form-group select { padding: 0.75rem 0.875rem; }
            .form-heading h2 { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="lamp-section" id="lampSection">
            <div class="lamp-background off" id="lampBackground"></div>
            <div class="lamp-container" id="lampContainer" draggable="false">
                <div class="lamp-light off" id="lampLight"></div>
                <svg class="lamp-svg" viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
                    <ellipse cx="100" cy="270" rx="25" ry="8" fill="#3a3f4d" opacity="0.8"/>
                    <rect x="85" y="250" width="30" height="25" fill="#2a3142" rx="2"/>
                    <rect x="97" y="80" width="6" height="170" fill="#b8941f" rx="3"/>
                    <circle cx="100" cy="80" r="8" fill="#d4af37"/>
                    <path d="M 70 35 L 80 10 Q 100 0 120 10 L 130 35 Z" fill="#c0c0c0" opacity="0.7"/>
                    <ellipse cx="100" cy="35" rx="30" ry="10" fill="#e8e8e8" opacity="0.6"/>
                    <ellipse cx="100" cy="33" rx="30" ry="8" fill="none" stroke="#d4af37" stroke-width="1"/>
                    <circle class="lamp-bulb off" cx="100" cy="60" r="18"/>
                    <path d="M 90 45 Q 100 30 110 45" fill="none" stroke="#4a4a4a" stroke-width="2" class="lamp-base-line"/>
                </svg>
                <div class="lamp-text">IMS Adaptive</div>
                <div class="lamp-hint">Traînez la souris pour allumer</div>
            </div>
        </div>

        <div class="form-section" id="formSection">
            <div class="form-container" id="formContainer">
                <div class="tab-container">
                    <button class="tab-btn active" data-tab="login">Connexion</button>
                    <button class="tab-btn" data-tab="register">Inscription</button>
                </div>

                <div class="tab-content active" id="login">
                    <div class="form-heading">
                        <h2>Bienvenue</h2>
                        <p>Connectez-vous à votre compte</p>
                    </div>
                    <div id="loginMessage" class="message"></div>
                    <form id="loginForm">
                        <div class="form-group">
                            <label for="loginEmail">Email</label>
                            <input type="email" id="loginEmail" placeholder="votre@email.com" required>
                        </div>
                        <div class="form-group">
                            <label for="loginPassword">Mot de passe</label>
                            <input type="password" id="loginPassword" placeholder="••••••••" required>
                        </div>
                        <div class="checkbox-group">
                            <input type="checkbox" id="rememberMe">
                            <label for="rememberMe">Se souvenir de moi</label>
                        </div>
                        <button type="submit" class="btn btn-primary">Se Connecter</button>
                    </form>
                    <div class="form-footer">
                        <p>Mot de passe oublié? <span class="link" onclick="showForgotPassword()">Réinitialiser</span></p>
                    </div>
                </div>

                <div class="tab-content" id="register">
                    <div class="form-heading">
                        <h2>Créer un Compte</h2>
                        <p>Rejoignez-nous et commencez à apprendre</p>
                    </div>
                    <div id="registerMessage" class="message"></div>
                    <form id="registerForm">
                        <div class="form-group">
                            <label for="registerNom">Nom</label>
                            <input type="text" id="registerNom" placeholder="Votre nom" required>
                        </div>
                        <div class="form-group">
                            <label for="registerPrenom">Prénom</label>
                            <input type="text" id="registerPrenom" placeholder="Votre prénom" required>
                        </div>
                        <div class="form-group">
                            <label for="registerEmail">Email</label>
                            <input type="email" id="registerEmail" placeholder="votre@email.com" required>
                        </div>
                        <div class="form-group">
                            <label for="registerPassword">Mot de passe</label>
                            <input type="password" id="registerPassword" placeholder="Minimum 6 caractères" required>
                        </div>
                        <div class="form-group">
                            <label for="registerRole">Vous êtes</label>
                            <select id="registerRole" required>
                                <option value="">-- Sélectionner un rôle --</option>
                                <option value="etudiant">Étudiant</option>
                                <option value="enseignant">Enseignant</option>
                            </select>
                        </div>
                        <div class="checkbox-group">
                            <input type="checkbox" id="terms" required>
                            <label for="terms">J'accepte les conditions d'utilisation</label>
                        </div>
                        <button type="submit" class="btn btn-primary">Créer un Compte</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="api-client.js"></script>

    <script>
        let isLampOn = false;
        let isDragging = false;
        let dragDistance = 0;
        const lampContainer = document.getElementById('lampContainer');
        const lampBackground = document.getElementById('lampBackground');
        const lampLight = document.getElementById('lampLight');
        const lampBulb = document.querySelector('.lamp-bulb');
        const lampBaseLine = document.querySelector('.lamp-base-line');
        const lampHint = document.querySelector('.lamp-hint');
        const formContainer = document.getElementById('formContainer');
        const tabBtns = document.querySelectorAll('.tab-btn');
        const tabContents = document.querySelectorAll('.tab-content');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');

        lampContainer.addEventListener('mousedown', startDrag);
        document.addEventListener('mousemove', dragLamp);
        document.addEventListener('mouseup', stopDrag);
        lampContainer.addEventListener('touchstart', startDrag);
        document.addEventListener('touchmove', dragLamp);
        document.addEventListener('touchend', stopDrag);

        let lastX = 0, lastY = 0;

        function startDrag(e) {
            if (isLampOn) return;
            isDragging = true;
            dragDistance = 0;
            lampContainer.classList.add('active');
        }

        function dragLamp(e) {
            if (!isDragging || isLampOn) return;
            const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
            dragDistance += Math.abs(clientX - (lastX || clientX)) + Math.abs(clientY - (lastY || clientY));
            lastX = clientX;
            lastY = clientY;
            if (dragDistance > 80) {
                turnLampOn();
                isDragging = false;
            }
        }

        function stopDrag() {
            isDragging = false;
            dragDistance = 0;
            lastX = 0;
            lastY = 0;
            lampContainer.classList.remove('active');
        }

        function turnLampOn() {
            if (isLampOn) return;
            isLampOn = true;
            lampBackground.classList.remove('off');
            lampBackground.classList.add('on');
            lampLight.classList.remove('off');
            lampLight.classList.add('on');
            lampBulb.classList.remove('off');
            lampBulb.classList.add('on');
            lampBaseLine.setAttribute('stroke', '#d4af37');
            lampHint.classList.add('hidden');
            setTimeout(() => formContainer.classList.add('visible'), 100);
        }

        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const tabName = btn.dataset.tab;
                tabBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                tabContents.forEach(content => content.classList.remove('active'));
                document.getElementById(tabName).classList.add('active');
            });
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const btn = loginForm.querySelector('.btn-primary');
            try {
                btn.classList.add('loading');
                const response = await apiClient.login(email, password);
                showMessage('loginMessage', `Bienvenue ${response.user.nom}!`, 'success');
                localStorage.setItem('user', JSON.stringify(response.user));
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1500);
            } catch (error) {
                let msg = error.message || 'Erreur de connexion';
                if (error.status === 401) msg = 'Email ou mot de passe incorrect';
                showMessage('loginMessage', msg, 'error');
            } finally {
                btn.classList.remove('loading');
            }
        });

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const nom = document.getElementById('registerNom').value;
            const prenom = document.getElementById('registerPrenom').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            const role = document.getElementById('registerRole').value;
            const btn = registerForm.querySelector('.btn-primary');
            if (!role) {
                showMessage('registerMessage', 'Veuillez sélectionner un rôle', 'warning');
                return;
            }
            try {
                btn.classList.add('loading');
                const response = await apiClient.register(nom, prenom, email, password, role);
                showMessage('registerMessage', 'Compte créé avec succès! Connexion...', 'success');
                localStorage.setItem('user', JSON.stringify(response.user));
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1500);
            } catch (error) {
                let msg = error.message || 'Erreur d\'inscription';
                if (error.data && error.data.errors) {
                    msg = Object.values(error.data.errors).flat().join(', ');
                }
                showMessage('registerMessage', msg, 'error');
            } finally {
                btn.classList.remove('loading');
            }
        });

        function showMessage(elementId, message, type) {
            const el = document.getElementById(elementId);
            el.textContent = message;
            el.className = `message show ${type}`;
            setTimeout(() => el.classList.remove('show'), 5000);
        }

        function showForgotPassword() {
            alert('Fonctionnalité de réinitialisation à implémenter');
        }

        window.addEventListener('load', () => {
            if (localStorage.getItem('auth_token')) {
                window.location.href = 'dashboard.html';
            }
        });
    </script>
</body>
</html>
